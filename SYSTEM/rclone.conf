# Token asli di sini sudah bocor (ter-commit ke repo, sudah expired sejak
# 2022-10-25) — SUDAH DIHAPUS dari file ini. Rotate/cabut OAuth token itu di
# akun Google Drive terkait, lalu generate ulang config ini via `rclone config`
# sendiri. Jangan commit rclone.conf berisi token asli ke git lagi.
[dr]
type = drive
scope = drive
token: GANTI_DENGAN_TOKEN_HASIL_RCLONE_CONFIG_SENDIRI
